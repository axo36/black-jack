<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Blackjack</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="menu-overlay" class="menu-overlay">
    <div class="menu-box">
      <div class="menu-cartes">
        <div class="mini-carte c1">A♠</div>
        <div class="mini-carte c2">K♥</div>
        <div class="mini-carte c3">7♦</div>
      </div>
      <h1>Blackjack</h1>
      <p>Affronte la banque : approche-toi de 21 sans le dépasser, mieux qu'elle. Les autres joueurs cachent leur jeu jusqu'à la fin, pour le suspense...</p>
      <button id="jouer-button">Jouer</button>
    </div>
  </div>

  <div class="container">
    <h1 class="titre">Table de Blackjack</h1>

    <div id="deck" class="card deck-animated"><h2>Piocher</h2></div>

    <div class="player haut" id="haut"><span class="badge-banque">🏦 Banque</span><span class="nom"></span><span class="score" id="score-haut">?</span><span class="statut" id="statut-haut"></span></div>
    <div class="player bas" id="bas"><span class="nom">Moi</span><span class="score" id="score-bas">0</span></div>
    <div class="player gauche" id="gauche"><span class="nom"></span><span class="score" id="score-gauche">?</span><span class="statut" id="statut-gauche"></span></div>
    <div class="player droite" id="droite"><span class="nom"></span><span class="score" id="score-droite">?</span><span class="statut" id="statut-droite"></span></div>

    <div class="actions">
      <button id="stop-button" class="stop-button">Arrêter de piocher</button>
      <button id="rejouer-button" class="rejouer-button">Rejouer</button>
    </div>
    <div id="resultat"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
